name: סנכרון יומנים

on:
  schedule:
    # every hour between 06:00 and 22:00 Israel time (03:00–20:00 UTC, also covers winter time)
    - cron: "17 3-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: site-updates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q icalendar recurring-ical-events
      - name: Pull Google Calendars into the site
        run: python3 scripts/sync_calendars.py index.html
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "shaked-calendar-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "עדכון אירועים מיומני Google"
          git push
