/* Layout: a calm school notice board — emblem header, tab bar, one working view at a time; water-blue for actions, palm-green for life, semantic colors only for event types */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --ink:#16201e; --muted:#58686a; --line:#d6dfdc;
  --water:#1f6f96; --water-soft:#dcecf4; --palm:#36703f; --palm-soft:#e0eee1;
  --exam:#b03a32; --exam-soft:#f8e3e0; --holiday:#9a6a12; --holiday-soft:#f6ecd6;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-hand:"Amatic SC","Assistant",cursive;
  --r:10px;
}
:root,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
a{color:var(--water)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px;padding-block:18px 12px}
.emblem{width:76px;height:76px;border-radius:50%;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.emblem img{width:92%;height:auto}
.brand-text{min-width:0}
.brand h1{font-size:clamp(1.45rem,4.2vw,2.1rem);letter-spacing:-.01em}
.brand h1 b{font-weight:400}
.brand h1 span{font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:.78em}
.motto{font-family:var(--f-hand);color:var(--water);font-size:1.7rem;line-height:1;margin-top:2px}
.net{margin-inline-start:auto;font-size:.8rem;color:var(--muted);text-align:center;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--palm)}
@media (max-width:560px){.net{display:none}.emblem{width:60px;height:60px}}

main{padding-block:22px 90px}
.view{display:grid;gap:18px}
.sample-note{background:var(--holiday-soft);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-size:.92rem}
.sample-note b{color:var(--holiday)}

/* controls */
.controls{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-weight:700;margin-inline-end:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--palm);border-color:var(--palm);color:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-weight:600;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--water-soft);color:var(--water)}
.spacer{flex:1}

/* exam strip */
.focus{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.focus h2{font-size:1.15rem}
.focus-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.exam-card{flex:none;min-width:150px;border-radius:8px;background:var(--exam-soft);padding:8px 12px;display:grid;gap:2px}
.exam-card .d{font-size:.8rem;color:var(--exam);font-weight:700}
.exam-card .t{font-weight:700}
.exam-card .g{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-size:.95rem}

/* agenda */
.week{display:grid;gap:8px}
.week h3{font-size:1rem;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.02em;padding-top:6px}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;border-inline-start:5px solid var(--c,var(--water))}
.ev .date{text-align:center;line-height:1.1}
.ev .date .n{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.ev .date .w{font-size:.78rem;color:var(--muted)}
.ev .body{min-width:0}
.ev .title{font-weight:700}
.ev .note{color:var(--muted);font-size:.92rem;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:.75rem;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted);font-weight:600}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--cs);color:var(--c);white-space:nowrap}
.t-exam{--c:var(--exam);--cs:var(--exam-soft)}
.t-event{--c:var(--water);--cs:var(--water-soft)}
.t-trip{--c:var(--palm);--cs:var(--palm-soft)}
.t-holiday{--c:var(--holiday);--cs:var(--holiday-soft)}
.past{opacity:.55}

/* month */
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.month-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.month-head h2{font-size:1.25rem;flex:1;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cell{min-height:86px;border-radius:6px;background:var(--bg);padding:4px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent;cursor:pointer;text-align:start}
.cell.out{opacity:.35}
.cell.today{border-color:var(--palm)}
.cell.sel{border-color:var(--water);background:var(--water-soft)}
.cell .num{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.mini{font-size:.72rem;line-height:1.25;border-radius:3px;padding:1px 4px;background:var(--cs);color:var(--c);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
@media (max-width:640px){.cell{min-height:48px}.mini{display:none}.dots{display:flex}}
.day-detail{margin-top:12px;display:grid;gap:8px}

/* posts */
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px}
.post .meta{font-size:.85rem;color:var(--muted);font-weight:600}
.post h2{font-size:1.45rem}
.post .text{white-space:pre-line;max-width:65ch}
.post details summary{cursor:pointer;color:var(--water);font-weight:600}
.masthead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.masthead h2{font-size:2rem;color:var(--palm)}
.masthead p{margin:0;color:var(--muted)}

/* forms */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start;text-align:start;cursor:pointer}
.fcard:hover{border-color:var(--water)}
.fcard h3{font-size:1.15rem}
.fcard p{margin:0;color:var(--muted);font-size:.95rem}
.fcard .for{font-size:.78rem;font-weight:700;color:var(--palm)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;max-width:640px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.95rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--water);color:var(--surface);min-height:42px}
.btn.ghost{background:none;color:var(--water);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--exam);border:1px solid var(--line);padding:4px 10px;min-height:32px;font-size:.85rem}
.msg{font-weight:600;color:var(--palm)}
.msg.err{color:var(--exam)}
table.subs{border-collapse:collapse;width:100%;font-size:.92rem}
table.subs th,table.subs td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
.scroll{overflow-x:auto}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.photo figcaption{padding:8px 12px;font-size:.92rem}
.photo figcaption small{display:block;color:var(--muted)}
.empty-box{border:2px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted)}

/* editor */
.edit-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--palm);color:var(--surface);border-radius:var(--r);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edit-bar .btn{background:var(--surface);color:var(--palm)}
.edit-toggle{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));z-index:6}
.adder{background:var(--palm-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.adder .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}

/* area sub-navigation */
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;background:var(--surface);border:1px solid var(--line)}
.subnav a[aria-current="page"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:14px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px}
.sec-h h2{font-size:1.3rem}
.sec-h a{margin-inline-start:auto;font-weight:600;font-size:.92rem}
.news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.news-item{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.news-item:last-child{border-bottom:0}
.news-item .meta{font-size:.8rem;color:var(--muted);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.place{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.place h3{font-size:1.2rem}

/* add to personal calendar */
.sync{background:var(--water-soft);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sync b{flex:1 1 220px}
.sync .btn{background:var(--surface);color:var(--water);border:1px solid var(--line)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.ev .addcal{font-size:.78rem;font-weight:700;text-decoration:none;white-space:nowrap}

/* computers */
.bk-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.bk-form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.periods{display:flex;flex-wrap:wrap;gap:6px}
.periods label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600;font-size:.9rem;cursor:pointer}
.periods input:checked+span{color:var(--water)}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
table.bk{border-collapse:separate;border-spacing:0;width:100%;min-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.bk th,table.bk td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
table.bk thead th{background:var(--sunk);font-size:.85rem;color:var(--muted)}
table.bk th.p{white-space:nowrap;font-size:.9rem}
table.bk th.p small{display:block;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.bkchips{display:flex;flex-wrap:wrap;gap:5px}
.bkchip{display:inline-flex;align-items:center;gap:6px;background:var(--water-soft);border-radius:6px;padding:3px 8px;font-size:.88rem}
.bkchip.res{background:var(--palm-soft)}
.bkchip.rec{font-weight:700}
.bkchip button{border:0;background:none;cursor:pointer;color:var(--exam);font-size:1rem;line-height:1;padding:0 2px}
.free{border:1px dashed var(--line);background:none;border-radius:6px;padding:3px 10px;color:var(--muted);cursor:pointer;font-size:.85rem}
.legend{font-size:.85rem;color:var(--muted)}

/* footer */
.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:20px}
.foot-in{padding-block:24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:start}
.vision{margin:0;display:grid;gap:6px}
.vision p{margin:0;font-family:var(--f-display);font-size:1.3rem;line-height:1.35;color:var(--palm);max-width:34ch;text-wrap:balance}
.vision cite{font-style:normal;color:var(--muted);font-size:.9rem}
.contact{display:grid;gap:6px;font-size:1rem}
.contact div{display:flex;gap:10px}
.contact span:first-child{color:var(--muted);min-width:56px;font-size:.9rem}
.contact .sel{user-select:all;direction:ltr;unicode-bidi:isolate}

/* ===== header: deep valley-green band, emblem, name, vision ===== */
:root{--hero:#163a32;--hero-2:#1d4a40;--hero-ink:#f4f8f5;--hero-mute:#b9d3c8;--hero-water:#9fd3e8;--hero-line:rgba(159,211,232,.45);--bg-nav:var(--surface)}
.top{background:none;border-bottom:0}
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 100% 0%,var(--hero-2),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:12px 40px;align-items:center;padding-block:14px 4px}
.brand{display:flex;align-items:center;gap:18px;padding:0}
.emblem{width:76px;height:76px;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.brand-text{display:grid;gap:2px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--hero-mute);font-weight:700}
.brand h1{font-family:"Noto Serif Hebrew","Frank Ruhl Libre",serif;font-weight:700;font-size:clamp(1.8rem,4.6vw,2.5rem);line-height:1.05;color:var(--hero-ink);letter-spacing:-.01em}
.brand h1 span{font-family:var(--f-body);font-weight:400;color:var(--hero-mute);font-size:.62em;margin-inline-start:6px}
.motto{font-family:var(--f-hand);color:var(--hero-water);font-size:clamp(1.45rem,3.4vw,1.85rem);line-height:1;margin-top:2px}
.vision{margin:0;justify-self:end;max-width:40ch;display:grid;gap:3px;padding-inline-start:16px;border-inline-start:1px solid var(--hero-line);position:relative}
.vision-label{font-size:.78rem;letter-spacing:.12em;color:var(--hero-mute);font-weight:700}
.vision blockquote{margin:0;font-family:var(--f-body);font-weight:600;font-size:clamp(.98rem,1.7vw,1.12rem);line-height:1.45;color:var(--hero-ink);text-wrap:balance}
.vision blockquote::before{content:"”"}.vision blockquote::after{content:"“"}
.vision cite{font-style:normal;color:var(--hero-water);font-size:.85rem;font-weight:600}
.vision-label{font-size:.7rem}
.waves{display:block;width:100%;height:16px;position:relative}
.navbar{background:var(--bg-nav);border-bottom:1px solid var(--line)}
.navbar nav.tabs a{padding:12px 16px;font-size:1.02rem}
@media (max-width:700px){.hero-in{grid-template-columns:minmax(0,1fr)}.vision{justify-self:start}.vision-label{display:none}}
@media (max-width:560px){.emblem{width:60px;height:60px}.eyebrow{display:none}}

/* ===== שוקדים issue ===== */
.issue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:12px}
.issue-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.kicker{font-weight:800;color:var(--palm);letter-spacing:.02em}
.issue-head .meta{color:var(--muted);font-size:.9rem;font-weight:600}
.issue h2{font-size:clamp(1.5rem,3vw,1.9rem)}

.toc{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}

.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.page-thumb{flex:none;width:120px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0;cursor:zoom-in;overflow:hidden;display:grid}
.page-thumb img{width:100%;aspect-ratio:910/1287;object-fit:cover;display:block}
.page-thumb span{font-size:.78rem;color:#4a5856;padding:4px;text-align:center;background:#f3f5f4}
.viewer{position:fixed;inset:0;z-index:20;background:rgb(10 20 18 / .88);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.viewer-bar{display:flex;gap:8px;align-items:center;color:#fff;padding:10px 16px;font-weight:600}

.darca{height:52px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;justify-self:start;align-self:center}

/* ===== calm-down pass ===== */
.controls{gap:8px}
.chip{padding:4px 12px;min-height:34px;font-size:.92rem}
.seg button{padding:4px 12px;min-height:32px;font-size:.92rem}
.label{font-size:.72rem}
.focus{padding:10px 14px;gap:8px;background:none;border:0;padding-inline:0}
.focus h2{font-size:1rem;font-family:var(--f-body);font-weight:800;color:var(--exam)}
.exam-card{min-width:0;padding:5px 10px;gap:0;border-radius:6px}
.exam-card .t{font-size:.95rem}
.exam-card .d,.exam-card .g{font-size:.75rem}
.sync{background:none;padding:2px 0;gap:6px;font-size:.9rem;color:var(--muted)}
.sync a{font-weight:700;text-decoration:none}
.sync a:hover{text-decoration:underline}
.dotsep{color:var(--line)}
.month{padding:10px}
.month-head h2{font-size:1.15rem}
.cell{min-height:84px;background:var(--surface);border:1px solid var(--line)}
.cell.out{opacity:.4}
.cell.sel{border-color:var(--water);box-shadow:inset 0 0 0 1px var(--water);background:var(--surface)}
.grid{gap:4px}
.navbar .wrap{display:flex;align-items:center;gap:8px}
.navbar nav.tabs{flex:1}
.edit-link{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
.edit-link:hover{color:var(--ink)}
.foot-in{align-items:center}
@media (max-width:640px){
  .cell{min-height:62px;padding:2px;gap:1px}

  .dots{display:none}
  .grid{gap:2px}
  .dow{font-size:.68rem}
}

/* day detail: one slim line per event */
.day-detail h3{font-family:var(--f-body);font-weight:800}
.drows{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.drow{display:grid;grid-template-columns:4px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 12px 7px 10px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}

.drow .dt{font-weight:700;font-size:.95rem;min-width:0}

.drow .dg{font-size:.78rem;color:var(--muted);white-space:nowrap}
.drow .addcal{font-size:.75rem}

/* phone: compact controls, one line each, swipe sideways */
@media (max-width:640px){

}

/* staff events */
:root{--staff:#6a48a8;--staff-soft:#ece5f7}

/* study planner */

.exam-card.plannable:hover{box-shadow:inset 0 0 0 1px var(--exam)}
.exam-card{display:flex;flex-direction:column}
.drow{grid-template-columns:4px minmax(0,1fr) auto auto auto}
.planner-wrap{position:fixed;inset:0;z-index:30;background:rgb(16 24 22 / .45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.planner{background:var(--surface);border-radius:14px;box-shadow:0 18px 50px rgb(0 0 0 / .25);width:min(560px,100%);display:grid}
.planner header{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.planner header>div{flex:1;min-width:0}

.planner header h2{font-size:1.35rem;margin-top:2px}
.planner header p{margin:2px 0 0;color:var(--muted);font-weight:600}
.planner-body{padding:16px 18px;display:grid;gap:12px}
.planner-form{display:grid;gap:12px}
.planner-form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}

.plan-progress{display:grid;gap:6px;font-weight:700;font-size:.9rem}
.plan-progress .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.plan-progress .bar i{display:block;height:100%;background:var(--palm);border-radius:99px}
.plan-days{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan-days li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}

.pd-check{display:flex;gap:8px;align-items:center;cursor:pointer}
.pd-check input{width:18px;height:18px;accent-color:var(--palm)}

/* month navigation */
.mnav{border:1px solid var(--line);background:var(--surface);color:var(--water);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px}
.mnav:hover{background:var(--water-soft)}

.gcal-add{flex:none;white-space:nowrap;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--water);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px}
.gcal-add:hover{background:var(--water-soft)}

/* search */

/* page cards with their topics */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:visible}
.page-thumb{width:auto;display:grid;grid-template-rows:auto 1fr;text-align:start;background:var(--surface);transition:border-color .15s}

/* footer: dark band that echoes the header */
.foot{background:var(--hero);border-top:0;margin-top:28px;color:var(--hero-ink)}

/* my week */
.myweek{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:12px;margin-bottom:18px}

א"]}, {"id": "c9180e0f73f", "date": "2027-07-06", "title": "בגרות אנגלית בעפ מועד ב", "type": "exam", "grades": ["יב"], "note": "", "src": "gcal", "cals": ["יב"]}, {"id": "cf03c2946c6", "date": "2027-07-07", "title": "בגרות אנגלית מועד ב", "type": "exam", "grades": ["all"], "note": "", "src": "gcal", "cals": ["school"]}, {"id": "c62eda93fd6", "date": "2027-07-08", "title": "בגרות מתמטיקה מועד ב", "type": "exam", "grades": ["all"], "note": "", "src": "gcal", "cals": ["school"]}, {"id": "ceb1575d2c8", "date": "2027-07-22", "title": "י״ז בתמוז", "type": "holiday", "grades": ["all"], "note": "", "src": "gcal", "cals": ["holidays"]}, {"id": "c20ba863e90", "date": "2027-08-11", "title": "ערב תשעה באב", "type": "holiday", "grades": ["all"], "note": "", "src": "gcal", "cals": ["holidays"]}, {"id": "cc061c7fdbe", "date": "2027-08-12", "title": "תשעה באב", "type": "holiday", "grades": ["all"], "note": "", "src": "gcal", "cals": ["holidays"]}, {"id": "c2964f9e591", "date": "2027-08-24", "title": "פולין", "type": "event", "grades": ["all"], "note": "", "src": "gcal", "cals": ["school"], "end": "2027-08-31"}], "posts": [{"id": "s8", "date": "2026-10-29", "heb": "חשוון תשפ״ז", "title": "פרשת לך לך", "body": "שלום לכולם,\n\nאיזה שינוי דרמטי חווה אברהם בתחילת פרשתנו, פרשת לך לך. עם היענותו לקריאתו של הקב״ה הוא מגיע אל הארץ לבדו ומהלך בה בביטחון רב. כך נראה, בכל אופן, כאשר הוא מתהלך משכם דרך בית אל ועד הנגב. לא רק זאת אף זאת – הוא במיעוט ברור כגר המגיע אל ארץ כנען בה לא היה מעולם ״וְהַכְּנַעֲנִי, אָז בָּאָרֶץ״ אבל נראה שמתהלך בביטחון גמור ובונה מזבחות בכל מקום אליו מגיע. לא צריך להאריך בקריאה כדי להגיע אל תיאור של נקודה הפוכה לחלוטין. אברהם יורד למצרים כעבור 10 פסוקים בלבד והמצב משתנה כהרף עין. עוד לפני שהוא מגיע אל מצרים ״כַּאֲשֶׁר הִקְרִיב לָבוֹא מִצְרָיְמָה״ חששותיו כל כך גדולים שהוא נגרר לתכנן תכנית הצלה המבוססת על כחש ועל שקר. הקל והפשוט הוא להבהיר כי זהו ההפרש שבין חיי ארץ ישראל לבין חיי הגולה. מה גורם לאברהם להרגיש ביטחון בארץ שהוא מתהלך בה עדיין כזר? מה, להבדיל, גורם לו להתנהל באופן כל כך חסר ביטחון עם הגעתו אל מצרים?\n\nהשאלה הגדולה יותר שמתעוררת מתוך קורותיו של אברהם בצעדיו הראשונים דווקא לאחר היענותו לקריאה ללכת אל ארץ כנען, וזו גם הנקודה שמעסיקה את המפרשים בהרחבה, כיצד ומדוע מתואר דווקא אברהם באופן כזה שנדמה בעינינו לכאורה כאילו לא מחמיא לו כלל. אברהם נבחר על ידי הקב״ה כאבי האומה והנה למרות פתיחה מרשימה ביותר אנחנו פוגשים אותו דווקא כאשר הוא חוטא ומחטיא.\n\nלמפרשים השונים שמורות התשובות ואני הקטן אסתפק בנסיון ללמוד משהו הנוגע להוויתנו כאן בארץ. זכיתי לחוש השבוע קצת יותר מקרוב טעימה מן התחושות המלוות את יהדות התפוצות ולעתים נראות לנו כל כך זרות. בתוך השיחות הלא-פורמליות ובאופן ברור, גם מן השיחות הפורמליות, בולטת תחושת אי-הביטחון של מיעוט החי בארץ זרה. אנשים יקרים שיהדותם חשובה להם ולעתים נדרשים להתאמץ מאוד כדי לשמור על הביטויים שלה. אולי אני טועה, אך נדמה לי כי באופן מעט מוזר תחושת אי-הביטחון הזו מעט חסרה לנו. כאשר אדם מסתובב בעולם עם אמת ברורה ונצחית אין זה חיובי. אולי חשוב לה, לתורה, לעצב את בחירתו של אברהם תוך הדגשת המאפיינים של חיי גלות. חיים שמכריחים אותך לחשוש, לחשוב, לא להישאב אל הידוע והמוכר.", "toc": ["פינת הפירגון", "טיולים שנתיים י״א–י״ב", "ז׳ בחשוון", "יום הזיכרון לרצח ראש הממשלה יצחק רבין", "נבחרות בית הספר", "מענה ראוי למחוננים", "בחירות לכנסת ישראל", "מופ״ד י״ב באופק"], "pages": ["media/ce9630a6e19dcebd36495685dae80877.jpg", "media/605cd9bc3405098081f7fe500fad5153.jpg", "media/53d70b281214a3ceee760e4a138118df.jpg", "media/a74fe0c09a4a6f16a5acff1ff41d8abf.jpg"], "pdf": "media/1b00530b925d1524cda27f4c13a611b0.pdf", "pageTopics": [["דבר המנהל: פרשת לך לך"], ["פינת הפירגון", "טיולים שנתיים י״א–י״ב"], ["ז׳ בחשוון", "יום הזיכרון לרצח ראש הממשלה יצחק רבין"], ["נבחרות בית הספר", "מענה ראוי למחוננים", "בחירות לכנסת ישראל", "מופ״ד י״ב באופק"]]}, {"id": "s9", "date": "2026-10-30", "heb": "חשוון תשפ״ז", "title": "פרשת וירא", "body": "שלום לכולם,\n\nפרשתנו, פרשת וירא, נפתחת בהתאוששותו של אברהם מברית המילה ומסתיימת בעקידת יצחק. כך ממבט על אולי היינו מגדירים את פרשתנו ככזו המעמידה במרכז את יחסיו של אברהם עם הקב״ה. מבט מעמיק יותר יפתח בפנינו צוהר למתח עמוק המלווה את פרשתנו. זאת משום שיחסיו של אברהם עם הקב״ה אינם היחסים היחידים הנמצאים במוקד הפרשה ואולי ישנם יחסים אחרים שאף מאפילים עליהם. אלו יחסיו של אברהם עם צאצאיו, ובפרט עם יצחק. מעניין הפער הזה בין אברהם המאמין הגדול לבין אברהם האבא. הדמות יוצאת הדופן המתגלית לנו ביחסיה עם הקב״ה על גילויי האמונה הפנטסטיים ועל ההקרבה הגדולה, הופכת לדמות רכה ומאוד אנושית כאשר אנחנו בוחנים את קורותיו של אברהם עם משפחתו. הפרשיה הפותחת את הפרשה אמנם מתרחשת כאשר הוא מתאושש מברית המילה אך במרכזה הבשורה על הולדת יצחק. גם המשך הפרשה ספוג כולו בנושא זה – כאשר אנו מגיעים אל סיפור הפיכתה של סדום, אנו מזהים את האנטי-תזה לחיי אברהם ובהתאם לכך, בנות לוט מתנהגות באופן הופכי לאברהם ויצחק. אנו ממשיכים ורואים את היחסים המתפתחים בין יצחק לישמעאל, המביאים למתח בין אברהם לשרה ובסופו של דבר אף לגירושם של ישמעאל והגר מפאת השפעתם הרעה על יצחק. לבסוף – כמובן, עקידת יצחק, שבה המתח בין אמונתו של אברהם בקב״ה לבין מחויבותו העמוקה לבנו הוא נוכח מאוד.\n\nמן העניין הזה בפרשתנו, חשבתי לעצמי שניתן לומר דבר מה בעל ערך הנוגע לאירועי השעה בחייה של אומה. בצילו של תהליך הבחירות אשר נסתיים זה עתה, אך השפעותיו ומשמעויותיו עדיין נוכחים מאוד ולא צפויים לחלוף, השיח הציבורי הוא חד וסוער. לעתים, אולי ניתן לעזור לו להתרכך אם נסתכל על הדברים לא רק דרך הפריזמה של האמונות והאידיאולוגיות, אלא גם דרך פריזמה מרוככת של משפחה. כאשר אברהם עונה ״הנני״ לקב״ה הוא נאמן לאמונתו הגדולה ומזדרז למצווה, כפי שרש״י מציין. לא עובר זמן רב עד שהוא עונה גם לבנו, יצחק, ״הנני״. זאת במענה לפנייתו אליו. הכל מתרכך. אז מגיע ״הנני״ שלישי. זאת במענה לקריאת המלאך ״אַל-תִּשְׁלַח יָדְךָ אֶל-הַנַּעַר, וְאַל-תַּעַשׂ לוֹ מְאוּמָה״. רק כאשר אברהם רואה גם את בנו ולא רק את שליחותו, ניתן לאזן בין השניים ואף יותר מכך – רק אז אומר המלאך לאברהם: ״כִּי עַתָּה יָדַעְתִּי, כִּי-יְרֵא אֱלֹהִים אַתָּה״ – הלוואי ונצליח כולנו ללמוד מאברהם, כי אנשים אחים אנחנו.", "toc": ["פינת הפירגון", "הישגי נבחרות הספורט", "Model UN במשגב", "העצמת תלמידים בחטיבה", "פעילות ׳דרך ארץ׳", "מופ״ד י״ב", "צו ראשון אחוד לתלמידי י״א", "מירוצי שדה", "מצב כיתות", "הטבה לצוות החובבים const menu=document.createElement("div"); menu.className="dropmenu"; menu.id="tabMenu"; menu.setAttribute("role","menu"); menu.hidden=true;
document.querySelector(".navbar").appendChild(menu);
let menuFor=null;
function closeMenu(){ if(menu.hidden) return; menu.hidden=true; if(menuFor) menuFor.setAttribute("aria-expanded","false"); menuFor=null; }
function openMenu(a){
  const area=a.dataset.area, cur=tab();
  menu.innerHTML=SUB[area].map(k=>`<a role="menuitem" href="#${k}" aria-current="${k===cur?"page":"false"}">${VIEWS[k].label}</a>`).join("");
  const nb=document.querySelector(".navbar").getBoundingClientRect(), r=a.getBoundingClientRect();
  menu.style.right=Math.max(8,nb.right-r.right)+"px"; menu.style.left="auto";
  menu.hidden=false; a.setAttribute("aria-expanded","true"); menuFor=a;
  const mr=menu.getBoundingClientRect(); if(mr.left<8){menu.style.right="auto";menu.style.left="8px";}
  const first=menu.querySelector('[aria-current="page"]')||menu.querySelector("a"); if(first && a.dataset.kbd) first.focus();
}
document.querySelectorAll("nav.tabs a").forEach(a=>{
  if(!SUB[a.dataset.area].length) return;
  a.setAttribute("aria-haspopup","menu"); a.setAttribute("aria-expanded","false"); a.setAttribute("aria-controls","tabMenu");
  a.insertAdjacentHTML("beforeend",'<span class="chev" aria-hidden="true">▾</span>');
  a.addEventListener("click",ev=>{ev.preventDefault(); if(menuFor===a) closeMenu(); else {closeMenu(); openMenu(a);} });
  a.addEventListener("keydown",ev=>{ if(ev.key==="ArrowDown"){ev.preventDefault(); a.dataset.kbd=1; closeMenu(); openMenu(a); delete a.dataset.kbd;} });
});
menu.addEventListener("click",ev=>{ if(ev.target.closest("a")) closeMenu(); });
menu.addEventListener("keydown",ev=>{
  const items=[...menu.querySelectorAll("a")], i=items.indexOf(document.activeElement);
  if(ev.key==="ArrowDown"){ev.preventDefault();items[(i+1)%items.length].focus();}
  else if(ev.key==="ArrowUp"){ev.preventDefault();items[(i-1+items.length)%items.length].focus();}
  else if(ev.key==="Escape"){const a=menuFor;closeMenu();a&&a.focus();}
});

/* ---------- calendar ---------- */
function visible(e){
  if(S.type==="holiday") S.type="all";
  if(S.type!=="all"){ if(S.type==="exam"&&e.type!=="exam") return false;
    if(S.type==="events"&&!(e.type==="event"||e.type==="trip")) return false;
    if(S.type==="holiday"&&e.type!=="holiday") return false; }
  const staffArea = VIEWS[tab()].area==="staff";
  if(!staffArea && isStaff(e)) return false;
  if(staffArea && isStaff(e)) return true;
  if(S.grade==="all") return e.cals ? (e.cals.includes("school")||e.cals.includes("holidays")) : e.grades.includes("all");
  return e.grades.includes("all")||e.grades.includes(S.grade);
}
function isStaff(e){return e.grades.length===1&&e.grades[0]==="staff"}
function cls(e){return isStaff(e)?"staff":e.type}
function sorted(){return DATA.events.slice().sort((a,b)=>a.date.localeCompare(b.date))}
function gradeTags(e){return e.grades.map(g=>`<span class="tag">${esc(GL[g]||g)}</span>`).join("")}
function evRow(e){
  const d=pd(e.date);
  return `<div class="ev t-${cls(e)} ${d<today?"past":""}">
    <div class="date"><div class="n">${d.getDate()}</div><div class="w">${WD[d.getDay()]} · ${MN[d.getMonth()].slice(0,3)}</div></div>
    <div class="body"><div class="title">${esc(e.title)}</div>${e.end?`<div class="note">עד ${fmt(e.end)}</div>`:""}${e.note?`<div class="note">${esc(e.note)}</div>`:""}<div class="tags">${gradeTags(e)}</div></div>
    <div class="row" style="flex-direction:column;align-items:end;gap:6px"><span class="pill">${isStaff(e)?"צוות":TYPES[e.type]}</span>${planBtn(e)}<a class="addcal" href="${gLink(e)}" target="_blank" rel="noopener">+ ליומן שלי</a></div>
  </div>`;
}
function dayRow(e){
  return `<div class="drow t-${cls(e)}"><span class="bar"></span><span class="dt">${esc(e.title)}${e.note?`<small>${esc(e.note)}</small>`:""}</span><span class="dg">${e.grades.map(g=>esc(GL[g]||g)).join(", ")}</span>${planBtn(e)}<a class="addcal" href="${gLink(e)}" target="_blank" rel="noopener" aria-label="הוספה ליומן שלי">+ ליומן</a></div>`;
}
/* ---------- study planner (saved on this device only) ---------- */
function planKey(id){return "plan:"+id}
function canPlan(e){return e.type==="exam"&&pd(e.date)>today}
function planBtn(e,kind){ if(!canPlan(e)) return ""; const has=!!store.get(planKey(e.id),null);
  return `<button class="plan-btn ${kind==="card"?"in-card":""}" data-plan="${e.id}">${has?"התכנון שלי":"תכנון למידה"}</button>`; }
function buildPlan(e,topics,start,fri){
  const days=[]; const end=pd(e.date);
  for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)){ const w=d.getDay(); if(w===6) continue; if(w===5&&!fri) continue; days.push(iso(d)); }
  if(!days.length) return [];
  const T=topics.length?topics:["חומר המבחן"];
  if(days.length===1) return [{date:days[0],tasks:["חזרה כללית על כל הנושאים"]}];
  const study=days.slice(0,-1), out=[];
  if(T.length>=study.length){ const per=Math.ceil(T.length/study.length); for(let i=0;i<study.length;i++){const s=T.slice(i*per,(i+1)*per); if(s.length) out.push({date:study[i],tasks:s.slice()});} }
  else { let prev=-1; study.forEach((d,i)=>{const k=Math.floor(i*T.length/study.length); out.push({date:d,tasks:[k===prev?`המשך ותרגול: ${T[k]}`:T[k]]}); prev=k;}); }
  out.push({date:days[days.length-1],tasks:["חזרה כללית ופתרון מבחן לדוגמה"]});
  return out;
}
function planDayLink(e,day){
  const p=new URLSearchParams({action:"TEMPLATE",text:"למידה ל"+e.title,dates:ymd(day.date)+"/"+ymd(nextDay(day.date)),details:day.tasks.join("\n"),ctz:"Asia/Jerusalem"});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function openPlanner(id){

  if(!box){box=document.createElement("div");box.id="planner";box.className="planner-wrap";box.setAttribute("role","dialog");box.setAttribute("aria-label","תכנון למידה");document.body.appendChild(box);}

      body=`<form id="planForm" class="planner-form">
        <div class="field"><label for="plTopics">אילו נושאים יש במבחן? שורה לכל נושא</label><textarea id="plTopics" placeholder="למשל:\nפרק 1 – משוואות\nפרק 2 – פונקציות\nפרק 3 – גרפים">${esc(t)}</textarea></div>
        <div class="two"><div class="field"><label for="plStart">מתחילים ללמוד ב־</label><input id="plStart" type="date" value="${esc(plan?plan.start:iso(today))}" max="${esc(e.date)}"></div>
        <label class="check"><input type="checkbox" id="plFri" ${plan&&plan.fri?"checked":""}> ללמוד גם ביום שישי</label></div>
        <div class="row"><button class="btn">יצירת תכנון</button>${plan?`<button type="button" class="btn ghost" data-plan-cancel>ביטול</button>`:""}</div>
        <p class="legend">שבת לא נכנסת לתכנון. היום האחרון לפני המבחן מוקדש לחזרה כללית.</p></form>`;
    } else {
      const done=plan.done||{}, n=plan.days.length, c=plan.days.filter(d=>done[d.date]).length;
      body=`<div class="plan-progress"><span>בוצעו ${c} מתוך ${n} ימים</span><span class="bar"><i style="width:${n?Math.round(c*100/n):0}%"></i></span></div>
        <ol class="plan-days">${plan.days.map(d=>{const x=pd(d.date);return `<li class="${done[d.date]?"done":""} ${d.date===iso(today)?"is-today":""}"><label class="pd-check"><input type="checkbox" data-plan-done="${d.date}" ${done[d.date]?"checked":""}><span class="pd-date">יום ${WD[x.getDay()]}<b>${x.getDate()}.${x.getMonth()+1}</b></span></label><span class="pd-tasks">${d.tasks.map(t=>`<span>${esc(t)}</span>`).join("")}</span><a class="addcal" href="${planDayLink(e,d)}" target="_blank" rel="noopener">+ ליומן</a></li>`}).join("")}
        <li class="exam-day"><span class="pd-date">יום ${WD[pd(e.date).getDay()]}<b>${fmt(e.date)}</b></span><span class="pd-tasks"><span>${esc(e.title)} · בהצלחה!</span></span></li></ol>
        <div class="row"><button class="btn ghost" data-plan-edit>שינוי הנושאים</button><button class="btn danger" data-plan-del>מחיקת התכנון</button></div>
        <p class="legend">התכנון נשמר רק במכשיר הזה.</p>`;
    }
    box.innerHTML=`<div class="planner"><header><div><span class="kicker">תכנון למידה</span><h2>${esc(e.title)}</h2><p>${fmt(e.date)} · ${left===1?"מחר":`עוד ${left} ימים`}</p></div><button class="iconbtn" data-plan-close aria-label="סגירה">×</button></header><div class="planner-body">${body}</div></div>`;
    box.hidden=false;
  };
  box.onclick=ev=>{
    if(ev.target===box||ev.target.closest("[data-plan-close]")){box.hidden=true;render();return}
    const t=ev.target.closest("button,input"); if(!t) return;
    if("planEdit" in t.dataset) draw(true);

    else if(t.dataset.planDone){const p=store.get(planKey(id),null); if(!p) return; p.done=p.done||{}; p.done[t.dataset.planDone]=t.checked; store.set(planKey(id),p); draw(false);}
  };
  box.onsubmit=ev=>{ev.preventDefault();
    const topics=box.querySelector("#plTopics").value.split("\n").map(s=>s.trim()).filter(Boolean);
    const start=box.querySelector("#plStart").value||iso(today), fri=box.querySelector("#plFri").checked;
    const days=buildPlan(e,topics,pd(start),fri);
    if(!days.length){const f=box.querySelector("#planForm");f.insertAdjacentHTML("beforeend",`<p class="msg err">אין ימי למידה עד המבחן. נסו תאריך התחלה מוקדם יותר.</p>`);return}
    store.set(planKey(id),{topics,start,fri,days,done:{}}); draw(false);
  };
  draw(false);
}
function weekKey(d){const s=new Date(d);s.setDate(d.getDate()-d.getDay());return iso(s)}
function weekLabel(k){
  const s=pd(k), t0=new Date(today); t0.setDate(today.getDate()-today.getDay());
  const diff=Math.round((s-t0)/864e5/7);
  if(diff===0) return "השבוע"; if(diff===1) return "שבוע הבא"; if(diff===-1) return "שבוע שעבר";
  const e=new Date(s); e.setDate(s.getDate()+6);
  return `${s.getDate()}.${s.getMonth()+1} – ${e.getDate()}.${e.getMonth()+1}`;
}

  let h = `<div class="controls">
    <div class="row" role="group" aria-label="בחירת שכבה"><span class="label">שכבה</span>${g.map(x=>`<button class="chip" data-grade="${x}" aria-pressed="${S.grade===x}">${x==="all"?"לוח כללי":esc(GL[x])}</button>`).join("")}</div>
    <div class="row"><div class="seg" role="group" aria-label="סוג">${[["all","הכל"],["exam","מבחנים"],["events","אירועים חברתיים"]].map(([k,l])=>`<button data-type="${k}" aria-pressed="${S.type===k}">${l}</button>`).join("")}</div>
    <span class="spacer"></span><div class="seg" role="group" aria-label="תצוגה">${[["month","לוח חודשי"],["list","רשימת אירועים"]].map(([k,l])=>`<button data-mode="${k}" aria-pressed="${S.mode===k}">${l}</button>`).join("")}</div></div>
  </div>
${VIEWS[tab()].area==="staff"?`<p class="legend staff-legend"><span class="sw"></span>אירועי צוות (ישיבות מחנכים, ימי עיון) מסומנים בסגול</p>`:(S.grade==="all"?`<p class="legend">הלוח הכללי של שק״ד דרכא. לבחינות ולאירועים של שכבה, בחרו שכבה.</p>`:"")}`;
  h += S.mode==="list" ? listView(evs) : monthView(evs);

    ${exams.length?`<div class="focus-list">${exams.map(e=>{const d=pd(e.date);return `<div class="exam-card ${canPlan(e)?"plannable":""}" ${canPlan(e)?`data-plan="${e.id}" role="button" tabindex="0" title="תכנון למידה למבחן"`:""}><span class="d">יום ${WD[d.getDay()]}, ${fmt(e.date)}</span><span class="t">${esc(e.title)}</span><span class="g">${e.grades.map(x=>GL[x]).join(", ")}</span></div>`}).join("")}</div>`:`<p class="empty">אין מבחנים בשבועיים הקרובים${S.grade==="all"?"":" לשכבה הזו"}.</p>`}
  </section>`;
  if(VIEWS[tab()].area==="students") h += `<section class="sig"><div class="sig-head"><h3>חיפוש בלוח</h3><input id="sigQ" type="search" placeholder="חיפוש אירוע, למשל: טיול, בגרות, חנוכה" value="${esc(S.sigQ||"")}" aria-label="חיפוש אירועים"></div><div id="sigRes"></div></section>`;

function listView(evs){
  const up = evs.filter(e=>pd(e.date)>=today), past = evs.filter(e=>pd(e.date)<today);
  const show = S.showPast? past.concat(up): up;
  const top=calLinks()?`<div class="mh-sub" style="justify-content:flex-start">${calLinks()}</div>`:"";
  if(!show.length) return top+`<p class="empty">אין אירועים להצגה לפי הסינון שנבחר.</p>`;
  const groups = {}; show.forEach(e=>{(groups[weekKey(pd(e.date))]??=[]).push(e)});
  return top+(past.length?`<div><button class="btn ghost" data-toggle-past>${S.showPast?"הסתרת אירועים שעברו":"הצגת אירועים שעברו ("+past.length+")"}</button></div>`:"")+
    Object.keys(groups).map(k=>`<section class="week"><h3>${weekLabel(k)}</h3>${groups[k].map(evRow).join("")}</section>`).join("");
}
function monthView(evs){
  const m=S.monthStart, start=new Date(m); start.setDate(1-m.getDay());
  const byDay={}; evs.forEach(e=>{const d=pd(e.date), last=pd(e.end||e.date); for(let x=new Date(d); x<=last; x.setDate(x.getDate()+1)) (byDay[iso(x)]??=[]).push(e)});
  let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const list=byDay[k]||[];
    if(i>=35&&d.getMonth()!==m.getMonth()) break;
    cells+=`<button class="cell ${d.getMonth()!==m.getMonth()?"out":""} ${+d===+today?"today":""} ${S.selDay===k?"sel":""}" data-day="${k}" aria-label="${d.getDate()} ב${MN[d.getMonth()]}, ${list.length} אירועים">
      <span class="num">${d.getDate()}</span>${list.slice(0,3).map(e=>`<span class="mini t-${cls(e)}">${esc(e.title)}</span>`).join("")}${list.length>3?`<span class="mini t-event">+${list.length-3}</span>`:""}
      <span class="dots">${list.map(e=>`<span class="dot t-${cls(e)}"></span>`).join("")}</span></button>`;}
  const det = S.selDay?(byDay[S.selDay]||[]):null;
  return `<section class="month"><div class="month-head"><button class="mnav" data-month="-1">→ ${MN[(m.getMonth()+11)%12]}</button><div class="mh-mid"><h2>${MN[m.getMonth()]} ${m.getFullYear()}</h2><div class="mh-sub">${(m.getMonth()!==today.getMonth()||m.getFullYear()!==today.getFullYear())?`<button class="mnav today-btn" data-month-today>היום</button>`:""}${calLinks()}</div></div><button class="mnav" data-month="1">${MN[(m.getMonth()+1)%12]} ←</button></div>
    <div class="grid">${WD.map(w=>`<div class="dow">${w}</div>`).join("")}${cells}</div>
    ${det?`<div class="day-detail"><h3 style="font-size:1rem">${fmt(S.selDay)}</h3>${det.length?`<div class="drows">${det.map(dayRow).join("")}</div>`:`<p class="empty">אין אירועים ביום הזה.</p>`}</div>`:""}</section>`;
}

function icsFor(){
  const esc2=s=>String(s||"").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");

  }
  const end=new Date(today); end.setDate(today.getDate()+7);
  const evs=sorted().filter(e=>!isStaff(e)&&(e.grades.includes(g)||e.grades.includes("all"))&&pd(e.end||e.date)>=today&&pd(e.date)<=end);
  const days={}; evs.forEach(e=>{const s=pd(e.date)<today?iso(today):e.date;(days[s]??=[]).push(e)});

/* ---------- running photos in the updates column ---------- */
const SL={i:0,paused:false,hover:false};
function slideshow(ph){
  if(SL.i>=ph.length) SL.i=0;
  return `<div class="slides" role="region" aria-roledescription="קרוסלה" aria-label="תמונות מבית הספר">
    <div class="slide-stage">${ph.map((p,k)=>`<figure class="slide ${k===SL.i?"on":""}" aria-hidden="${k===SL.i?"false":"true"}"><a href="#gallery" tabindex="-1"><img src="${esc(p.url)}" alt="${esc(p.caption||"תמונה מבית הספר")}" ${k?'loading="lazy"':""}></a><figcaption>${esc(p.caption||"")}<small>${fmt(p.date)}</small></figcaption></figure>`).join("")}</div>
    ${ph.length>1?`<div class="slide-ctl"><button class="slide-btn" data-slide-pause aria-label="${SL.paused?"הפעלת התמונות":"עצירת התמונות"}">${SL.paused?"▶":"❚❚"}</button><span class="slide-dots">${ph.map((p,k)=>`<button class="slide-dot" data-slide="${k}" aria-label="תמונה ${k+1}" aria-current="${k===SL.i}"></button>`).join("")}</span><span class="slide-n">${SL.i+1} / ${ph.length}</span></div>`:""}
  </div>`;
}
function showSlide(k){
  const box=document.querySelector(".slides"); if(!box) return;
  const all=box.querySelectorAll(".slide"); if(!all.length) return;
  SL.i=(k+all.length)%all.length;
  all.forEach((el,j)=>{el.classList.toggle("on",j===SL.i);el.setAttribute("aria-hidden",j===SL.i?"false":"true")});
  box.querySelectorAll(".slide-dot").forEach((b,j)=>b.setAttribute("aria-current",j===SL.i));
  const n=box.querySelector(".slide-n"); if(n) n.textContent=`${SL.i+1} / ${all.length}`;
}
setInterval(()=>{ if(SL.paused||SL.hover||document.hidden) return; showSlide(SL.i+1); },4500);
document.addEventListener("click",ev=>{
  const dot=ev.target.closest("[data-slide]"); if(dot){showSlide(Number(dot.dataset.slide));return}
  const pb=ev.target.closest("[data-slide-pause]"); if(pb){SL.paused=!SL.paused;pb.textContent=SL.paused?"▶":"❚❚";pb.setAttribute("aria-label",SL.paused?"הפעלת התמונות":"עצירת התמונות")}
});
document.addEventListener("pointerover",ev=>{SL.hover=!!ev.target.closest(".slide-stage")});
document.addEventListener("focusin",ev=>{SL.hover=!!ev.target.closest(".slides")});

/* ---------- live calendars ---------- */
// newest list wins: the copy embedded in the page, the last one this browser received, or a fresh one from Google
function applyCal(c){
  if(!c||!c.ok||!Array.isArray(c.events)||c.events.length<30) return false;
  if(DATA.syncedAt&&c.syncedAt&&c.syncedAt<DATA.syncedAt) return false;
  c.events.forEach(fixEvent);
  DATA.events=(DATA.events||[]).filter(e=>e.src!=="gcal").concat(c.events);
  DATA.syncedAt=c.syncedAt;
  return true;
}
applyCal(store.get("cal",null));
let calAt=0;
function loadCal(){
  if(!CAL_URL||Date.now()-calAt<120000) return;
  calAt=Date.now();
  fetch(CAL_URL,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(c=>{
    if(applyCal(c)){ store.set("cal",c); if(!S.editing) render(); }
  }).catch(()=>{});
}

  if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let deferred=null;
  const btn=()=>document.getElementById("installBtn");
  function show(){const b=btn(); if(b&&!standalone) b.hidden=false}
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show()});
  window.addEventListener("appinstalled",()=>{const b=btn(); if(b) b.hidden=true; deferred=null});
  if(isIOS&&!standalone) document.addEventListener("DOMContentLoaded",show);
  document.addEventListener("click",async e=>{
    if(!e.target.closest("#installBtn")) return;
    if(deferred){deferred.prompt(); try{await deferred.userChoice}catch(_){} deferred=null; return}
    if(document.querySelector(".ios-tip")) return;
    const t=document.createElement("div"); t.className="ios-tip"; t.setAttribute("role","dialog"); t.setAttribute("aria-label","התקנת האפליקציה");
    t.innerHTML=isIOS?'<b>התקנה באייפון</b><ol><li>פותחים את האתר בדפדפן Safari.</li><li>לוחצים על כפתור השיתוף (ריבוע עם חץ למעלה).</li><li>בוחרים "הוספה למסך הבית" ואז "הוסף".</li></ol><button type="button">הבנתי</button>'
      :'<b>התקנת האפליקציה</b><ol><li>פותחים את תפריט הדפדפן (שלוש הנקודות).</li><li>בוחרים "התקנת האפליקציה" או "הוספה למסך הבית".</li></ol><button type="button">הבנתי</button>';
    t.querySelector("button").onclick=()=>t.remove(); document.body.appendChild(t);
  });
})();
</script>
</body>
</html>
